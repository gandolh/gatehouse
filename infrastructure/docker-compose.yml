# Gatehouse: the API. Build context is the repo root (..) because the image
# needs the root lockfile and every workspace manifest.
#
#   docker compose -f infrastructure/docker-compose.yml up -d
#
# `.env` in THIS directory is written by the deploy (0600) and is read twice:
# compose interpolates ${...} below from it, and gatehouse-api declares it as
# env_file so the same values reach the process. It is git-ignored because it
# carries the Ward client key. A local run needs none: the API then starts
# without Sign in with Ward and answers its health check.
#
# The project is named, so it never shares compose's default project name
# (the folder, `infrastructure`) with another app checked out the same way.
name: gatehouse

services:
  gatehouse-api:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
      target: prod
    image: gatehouse-api:1.0
    ports:
      # LOOPBACK ONLY. Without the 127.0.0.1 prefix this would be published on
      # every interface, reachable over plain HTTP past Caddy and its TLS. The
      # server's HOST is 0.0.0.0 because that is inside the container's network
      # namespace; this line decides who can reach it.
      - "127.0.0.1:${GATEHOUSE_PORT:-8815}:${GATEHOUSE_PORT:-8815}"
    env_file:
      # Optional, so a local `compose up` works with no .env; the deploy writes one.
      - path: .env
        required: false
    # These beat env_file. A dev .env copied here (HOST=127.0.0.1, a local
    # GATEHOUSE_DATA_DIR) would otherwise leave the server unreachable or
    # writing outside the volume.
    environment:
      HOST: 0.0.0.0
      PORT: "${GATEHOUSE_PORT:-8815}"
      GATEHOUSE_DATA_DIR: /data
      GATEHOUSE_CARDS_FILE: /app/content/cards.json
    volumes:
      # The sessions and the users Ward's sign-in made, bind-mounted from the
      # host so they survive deploys and "back up Gatehouse" means one path.
      # GATEHOUSE_HOST_DATA_DIR is the host's side; GATEHOUSE_DATA_DIR is the
      # server's own setting, fixed to /data above. Defaults to a local dir so
      # a dev `compose up` works.
      - ${GATEHOUSE_HOST_DATA_DIR:-../data}:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", 'wget -qO- "http://127.0.0.1:${GATEHOUSE_PORT:-8815}/v1/health"']
      interval: 30s
      timeout: 3s
      start_period: 10s
